services:
  db:
    image: postgres:16-alpine
    container_name: tictactoe-db
    environment:
      POSTGRES_DB: tictactoe
      POSTGRES_USER: tictactoe
      POSTGRES_PASSWORD: tictactoe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tictactoe -d tictactoe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
